<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <style>
      body { font-family: 'Google Sans', Roboto, Arial, sans-serif; margin: 12px; color: #202124; }
      h3 { font-size: 13px; font-weight: 500; color: #5f6368; margin: 0 0 6px; }
      #langs { margin-bottom: 12px; max-height: 45vh; overflow-y: auto; }
      label { display: flex; align-items: center; gap: 8px; padding: 5px 2px; font-size: 14px; cursor: pointer; border-radius: 4px; }
      label:hover { background: #f1f3f4; }
      button {
        width: 100%; padding: 12px; font-size: 15px; border: none; border-radius: 6px;
        background: #1a73e8; color: #fff; cursor: pointer;
      }
      button:disabled { background: #9aa0a6; cursor: wait; }
      #status { margin-top: 10px; font-size: 13px; color: #5f6368; min-height: 1.2em; }
      #status.error { color: #d93025; }
      .hint { font-size: 12px; color: #80868b; margin-top: 14px; line-height: 1.4; }
    </style>
  </head>
  <body>
    <h3>Translate into</h3>
    <div id="langs">Loading…</div>
    <button id="go" onclick="run()" disabled>Translate</button>
    <div id="status"></div>
    <p class="hint">
      Click a text box on the slide (or select text inside one), then press the button.
      Translations are appended below the original text. Your language choice is remembered.
    </p>
    <script>
      google.script.run.withSuccessHandler(render).getLanguageState();

      function render(state) {
        var container = document.getElementById('langs');
        container.innerHTML = '';
        state.languages.forEach(function (lang) {
          var label = document.createElement('label');
          var box = document.createElement('input');
          box.type = 'checkbox';
          box.value = lang.code;
          box.checked = state.selected.indexOf(lang.code) !== -1;
          label.appendChild(box);
          label.appendChild(document.createTextNode(lang.label));
          container.appendChild(label);
        });
        document.getElementById('go').disabled = false;
      }

      function run() {
        var codes = Array.prototype.map.call(
          document.querySelectorAll('#langs input:checked'),
          function (box) { return box.value; }
        );
        var btn = document.getElementById('go');
        var status = document.getElementById('status');
        btn.disabled = true;
        status.className = '';
        status.textContent = 'Translating…';
        google.script.run
          .withSuccessHandler(function (res) {
            btn.disabled = false;
            status.className = res.error ? 'error' : '';
            status.textContent = res.text;
          })
          .withFailureHandler(function (err) {
            btn.disabled = false;
            status.className = 'error';
            status.textContent = 'Error: ' + err.message;
          })
          .translateSelection(codes);
      }
    </script>
  </body>
</html>
