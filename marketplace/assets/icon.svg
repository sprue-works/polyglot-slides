<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Polyglot Slides icon: a slide with a stacked translated copy behind it,
       and a speech-bubble "A / 文" mark. Keep edits here; render PNGs with
       tools/render-icons.sh. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a73e8"/>
      <stop offset="1" stop-color="#7b42f6"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#g)"/>
  <!-- back slide (translated copy) -->
  <rect x="34" y="26" width="72" height="50" rx="6" fill="#ffffff" fill-opacity="0.35"/>
  <!-- front slide -->
  <rect x="22" y="40" width="72" height="50" rx="6" fill="#ffffff"/>
  <rect x="30" y="50" width="34" height="6" rx="3" fill="#1a73e8"/>
  <rect x="30" y="62" width="52" height="4" rx="2" fill="#9aa0a6"/>
  <rect x="30" y="71" width="44" height="4" rx="2" fill="#9aa0a6"/>
  <!-- language mark -->
  <circle cx="96" cy="92" r="22" fill="#ffffff"/>
  <text x="84" y="100" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1a73e8">A</text>
  <text x="97" y="101" font-family="'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="20" fill="#7b42f6">文</text>
</svg>
