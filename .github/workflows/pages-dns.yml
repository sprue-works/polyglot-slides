name: Pages DNS

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Check the Pages CNAME or reconcile it in Cloudflare'
        required: true
        default: 'check'
        type: choice
        options:
          - 'check'
          - 'apply'

permissions:
  contents: read

concurrency:
  group: 'pages-dns'
  cancel-in-progress: false

jobs:
  reconcile:
    name: 'Cloudflare CNAME (${{ inputs.mode }})'
    runs-on: ubuntu-latest
    # Defense in depth: the protected 'pages-dns' environment already limits
    # deployments to main, but this guard also holds if that policy drifts.
    if: "github.ref == 'refs/heads/main'"
    environment: 'pages-dns'
    env:
      CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
      CLOUDFLARE_ZONE_ID: '${{ vars.CLOUDFLARE_ZONE_ID }}'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'main'
      - name: 'Check or reconcile DNS'
        run: 'tools/reconcile-pages-dns.sh --${{ inputs.mode }}'
