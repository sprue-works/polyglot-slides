# Lint / sanity checks. Runs on every PR and every push to main; needs no
# credentials, so it also runs on forks.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check Apps Script sources
        run: tools/lint.sh
      - name: Validate GitHub Actions workflows
        run: tools/lint-workflows.sh
      - name: Release script self-test (stubbed clasp)
        run: tools/test-release.sh
