# Deploys src/ to the Apps Script project in .clasp.json.
#
#   push to main  -> clasp push (HEAD of the script project == main)
#   tag v*        -> clasp push + clasp version + deploy that version
#                    (tools/release.sh; see README "Release pipeline")
#
# Auth: the CLASPRC_JSON repo secret holds the contents of a ~/.clasprc.json
# produced by `clasp login`. It is written to a temp file and handed to clasp
# via clasp_config_auth (the -A/--auth flag's env form). Apps Script's API
# does not accept service accounts for script projects, so a user refresh
# token is the only unattended option; scope the account accordingly.
name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys interleave (a main push racing a tag release).
concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: apps-script
    steps:
      - name: Configure clasp auth path
        run: echo "clasp_config_auth=$RUNNER_TEMP/clasprc.json" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install clasp
        run: npm install -g @google/clasp@3
      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::CLASPRC_JSON secret is not set (see README > Release pipeline > One-time setup)"
            exit 1
          fi
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$clasp_config_auth"
          clasp show-authorized-user
      - name: Push to Apps Script (main)
        if: github.ref_type == 'branch'
        run: clasp push --force
      - name: Version + deploy (tag)
        if: github.ref_type == 'tag'
        run: tools/release.sh "$GITHUB_REF_NAME"
      - name: Scrub credentials
        if: always()
        run: rm -f "$clasp_config_auth"
