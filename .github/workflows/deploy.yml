# Deploys src/ to the Apps Script project in .clasp.json.
#
#   push to main  -> clasp push (HEAD of the script project == main)
#   tag v*        -> clasp push + clasp version (tools/release.sh), then open
#                    a tracking issue: the Marketplace SDK pins a script
#                    VERSION NUMBER that a human must bump by hand before
#                    installed users get the release (README "Release
#                    pipeline", marketplace/RUNBOOK.md section 4)
#
# Auth: the CLASPRC_JSON repo secret holds the contents of a ~/.clasprc.json
# produced by `clasp login`. It is written to a temp file and handed to clasp
# via clasp_config_auth (the -A/--auth flag's env form). Apps Script's API
# does not accept service accounts for script projects, so a user refresh
# token is the only unattended option; scope the account accordingly.
name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys interleave (a main push racing a tag release).
concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: apps-script
    outputs:
      version: ${{ steps.release.outputs.version }}
      published_version: ${{ steps.release.outputs.published_version }}
    steps:
      - name: Configure clasp auth path
        run: echo "clasp_config_auth=$RUNNER_TEMP/clasprc.json" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install clasp
        run: npm install -g @google/clasp@3
      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::CLASPRC_JSON secret is not set (see README > Release pipeline > One-time setup)"
            exit 1
          fi
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$clasp_config_auth"
          clasp show-authorized-user
      - name: Push to Apps Script (main)
        if: github.ref_type == 'branch'
        run: clasp push --force
      - name: Cut script version (tag)
        if: github.ref_type == 'tag'
        id: release
        run: tools/release.sh "$GITHUB_REF_NAME"
      - name: Scrub credentials
        if: always()
        run: rm -f "$clasp_config_auth"

  # The Editor-add-on listing pins a version number, so the release is not
  # live until someone bumps it in App Configuration. Make that step a
  # visible, assignable issue instead of a line in the run summary. Its own
  # job so `issues: write` never reaches the credential-holding deploy job or
  # the push-to-main path. A re-run of the same tag cuts yet another version,
  # so if that tag's issue is still open, rewrite it rather than duplicating.
  track-version-bump:
    needs: deploy
    if: github.ref_type == 'tag' && needs.deploy.outputs.version != needs.deploy.outputs.published_version
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue for the manual version bump
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.deploy.outputs.version }}
          PUBLISHED: ${{ needs.deploy.outputs.published_version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Who gets the paste in their inbox: whoever pushed the tag, since
          # GitHub's assignment email carries the full body. The Actions variable
          # overrides that for the day a bot pushes tags.
          ASSIGNEE: ${{ vars.RELEASE_BUMP_ASSIGNEE || github.actor }}
          # Marketplace SDK -> App Configuration for GCP project 556097262294
          # (the SDK has no left-nav entry; this is its API Library page, RUNBOOK section 4).
          CONSOLE_URL: https://console.cloud.google.com/apis/api/appsmarket-component.googleapis.com/googleapps_sdk?project=556097262294
        run: |
          title_prefix="release $TAG: bump Slides add-on script version to"
          existing="$(gh issue list --state open --search "\"$title_prefix\" in:title" --json number,title \
            | jq -r --arg p "$title_prefix" '[.[] | select(.title | startswith($p))] | .[0].number // empty')"
          cat >"$RUNNER_TEMP/bump-issue.md" <<EOF
          Release \`$TAG\` created Apps Script version \`$VERSION\` ([run]($RUN_URL)). The Marketplace SDK still pins version \`$PUBLISHED\` (\`marketplace/listing.json\` → \`extension.publishedVersion\`), so installed users do not have this release yet.

          - [ ] Open [Marketplace SDK → Manage → App Configuration]($CONSOLE_URL) and set **Slides add-on script version** to \`$VERSION\`, then Save (\`marketplace/RUNBOOK.md\` §4; a version bump alone triggers no re-review)
          - [ ] Set \`extension.publishedVersion\` to \`$VERSION\` in \`marketplace/listing.json\` and commit, closing this issue

          Opened automatically by \`.github/workflows/deploy.yml\`.
          EOF
          title="$title_prefix $VERSION"
          if [ -n "$existing" ]; then
            # Same tag re-run: rewrite the open issue so its title and checklist
            # name the latest version, and leave a comment as the audit trail.
            echo "Tracking issue #$existing is still open for $TAG; updating it to version $VERSION."
            gh issue edit "$existing" --title "$title" --body-file "$RUNNER_TEMP/bump-issue.md"
            gh issue comment "$existing" --body "Re-run of \`$TAG\` ([run]($RUN_URL)) created Apps Script version \`$VERSION\`; the checklist above now points at that number."
          else
            gh issue create --title "$title" --assignee "$ASSIGNEE" --body-file "$RUNNER_TEMP/bump-issue.md"
          fi
